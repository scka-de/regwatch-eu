[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "regwatch-eu"
version = "0.1.0"
description = "Monitor EU regulatory changes across EUR-Lex, ESMA and EBA"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Gustavo" },
]
keywords = ["regulation", "eu", "dora", "mica", "ai-act", "compliance", "fintech"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "httpx>=0.27",
    "feedparser>=6.0",
    "pandas>=2.0",
    "click>=8.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
regwatch = "regwatch.cli:cli"

[project.urls]
Homepage = "https://github.com/scka-de/regwatch-eu"
Repository = "https://github.com/scka-de/regwatch-eu"

[tool.hatch.build.targets.wheel]
packages = ["src/regwatch"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests that hit live APIs (deselect with '-m not integration')",
]
